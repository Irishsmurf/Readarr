name: Docker

# Docker images are built and pushed:
#   • on every push to main  → rolling 'latest' image
#   • on every v* tag push   → semver-tagged release image
# PRs are intentionally excluded; the test workflow validates correctness.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Image tags and the reported application version are built from this plus the
  # run number. It used to be read out of azure-pipelines.yml, which was the last
  # thing keeping that file alive; the value is carried over unchanged from the
  # final upstream build so versions do not appear to go backwards.
  MAJOR_VERSION: '0.4.19'

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Derive version
        id: version
        run: |
          # For release tags (v1.2.3) use the tag itself as the version.
          # For rolling main builds fall back to MAJOR_VERSION.run_number.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${MAJOR_VERSION}.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build backend, frontend and packages
        env:
          READARRVERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # build.sh clears _output at the start of every backend build, and the
          # frontend lands in _output/UI, so the UI is stashed and restored
          # rather than rebuilt once per architecture.
          ./build.sh --backend -f net10.0 -r linux-x64
          ./build.sh --frontend
          cp -r _output/UI _ui
          ./build.sh --packages -f net10.0 -r linux-x64

          ./build.sh --backend -f net10.0 -r linux-arm64
          cp -r _ui _output/UI
          ./build.sh --packages -f net10.0 -r linux-arm64

      - name: Stage artifacts for the image
        run: |
          set -euo pipefail
          stage() {
            local rid="$1" arch="$2"
            mkdir -p "docker/artifacts/${arch}"
            cp -r "_artifacts/${rid}/net10.0/Readarr/." "docker/artifacts/${arch}/"
            # Drop the in-app updater: it would pull an upstream build that does
            # not carry this fork's fixes.
            rm -rf "docker/artifacts/${arch}/Readarr.Update"
          }
          stage linux-x64 amd64
          stage linux-arm64 arm64

      # The image installs libsqlite3-0, and a RUN layer executes in the target
      # platform's rootfs, so the arm64 build needs emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            READARR_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the amd64 image
        run: |
          set -euo pipefail
          # build-push-action does not leave an image in the local daemon when
          # pushing a multi-arch manifest, so rebuild the native arch to --load.
          docker buildx build --platform linux/amd64 --load -t readarr:smoke \
            --build-arg READARR_VERSION=${{ steps.version.outputs.version }} .
          docker run -d --name readarr-smoke -p 8787:8787 readarr:smoke
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/ping > /dev/null; then
              echo "Readarr responded to /ping"
              docker rm -f readarr-smoke
              exit 0
            fi
            sleep 2
          done
          echo "Readarr did not come up within 60s"
          docker logs readarr-smoke
          docker rm -f readarr-smoke
          exit 1
